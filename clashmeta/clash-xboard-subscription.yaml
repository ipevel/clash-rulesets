    path: ./ruleset/chinadomain-v2.yaml
    interval: 3600

  chinaip:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/ChinaIp.yaml"
    path: ./ruleset/chinaip-v2.yaml
    interval: 3600

  # 国内云厂商/公司自有 IDC 网段（阿里云、腾讯云等），GEOIP,CN 兜不住的部分
  chinaccompanyip:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/ChinaCompanyIp.yaml"
    path: ./ruleset/chinaccompanyip-v2.yaml
    interval: 3600

  # 国内 IPv6 网段（ChinaIp 只收 IPv4）
  chinaipv6:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/ChinaIpV6.yaml"
    path: ./ruleset/chinaipv6-v2.yaml
