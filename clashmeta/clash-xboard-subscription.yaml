    path: ./ruleset/dev-v2.yaml
    interval: 3600

  # === Microsoft ===
  bing:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/Bing.yaml"
    path: ./ruleset/bing-v2.yaml
    interval: 3600

  onedrive:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/OneDrive.yaml"
