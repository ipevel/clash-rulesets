    path: ./ruleset/telegram-v2.yaml
    interval: 3600

  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/TelegramCIDR.yaml"
    path: ./ruleset/telegramcidr-v2.yaml
    interval: 3600

  # === GFWlist 兜底代理 ===
  gfwlist:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/ProxyGFWlist.yaml"
    path: ./ruleset/gfwlist-v2.yaml
    interval: 3600

# --- 2. 策略组配置 ---
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: []

  # --- 应用分组 ---
  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  - name: 💬 Ai平台
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  # 社交：Instagram / Twitter / Facebook / Whatsapp / Discord / Reddit
  - name: 📱 社交
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  # 流媒体：YouTube / Netflix / Disney+ / HBO Max / Prime Video / Twitch / Spotify
  - name: 🎬 流媒体
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  - name: 🏷️ TikTok
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  # Google：Google / Google Play / Google FCM 三合一
  - name: 🔍 Google
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  # 开发者：GitHub / GitLab / Bitbucket / Docker Hub / npmjs / PyPI
  - name: 💻 开发者
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  - name: 🔎 微软 Bing
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择

  - name: ☁️ 微软云盘
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择

  - name: 🖥️ 微软服务
    type: select
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择

  # --- 工具分组（放最后）---
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

# --- 3. 规则分流逻辑（内联关键词优先匹配，RULE-SET兜底）---
rules:
  # === 本地网络直连 ===
  - DOMAIN-SUFFIX,local,🎯 全球直连
  - IP-CIDR,127.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,192.168.0.0/16,🎯 全球直连,no-resolve
  - IP-CIDR,10.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,172.16.0.0/12,🎯 全球直连,no-resolve
  - IP-CIDR,100.64.0.0/10,🎯 全球直连,no-resolve
  - IP-CIDR,169.254.0.0/16,🎯 全球直连,no-resolve
  - IP-CIDR,224.0.0.0/4,🎯 全球直连,no-resolve
  - IP-CIDR,0.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,240.0.0.0/4,🎯 全球直连,no-resolve
  - IP-CIDR6,::1/128,🎯 全球直连,no-resolve
  - IP-CIDR6,fc00::/7,🎯 全球直连,no-resolve
  - IP-CIDR6,fe80::/10,🎯 全球直连,no-resolve
  - IP-CIDR6,fd00::/8,🎯 全球直连,no-resolve

  # === AI平台（精确 provider 放前面；合并清单 ai 见本文件末尾）===
  - DOMAIN-KEYWORD,openai,💬 Ai平台
  - DOMAIN-KEYWORD,chatgpt,💬 Ai平台
  - DOMAIN-KEYWORD,claude,💬 Ai平台
  - DOMAIN-KEYWORD,anthropic,💬 Ai平台
  - DOMAIN-KEYWORD,gemini,💬 Ai平台
  - DOMAIN-SUFFIX,chatgpt.com,💬 Ai平台
  - DOMAIN-SUFFIX,claude.ai,💬 Ai平台
  - DOMAIN-SUFFIX,openai.com,💬 Ai平台
  - DOMAIN-SUFFIX,anthropic.com,💬 Ai平台
  - DOMAIN-SUFFIX,copilot.microsoft.com,💬 Ai平台
  - RULE-SET,openai,💬 Ai平台
  - RULE-SET,claude,💬 Ai平台
  - RULE-SET,googlegemini,💬 Ai平台
  - RULE-SET,ai,💬 Ai平台

  # === 社交（Instagram / Twitter / Facebook / Whatsapp / Discord / Reddit）===
  - DOMAIN-KEYWORD,instagram,📱 社交
  - DOMAIN-KEYWORD,twitter,📱 社交
  - DOMAIN-KEYWORD,facebook,📱 社交
  - DOMAIN-KEYWORD,fbcdn,📱 社交
  - DOMAIN-KEYWORD,whatsapp,📱 社交
  - DOMAIN-KEYWORD,discord,📱 社交
  - DOMAIN-KEYWORD,reddit,📱 社交
  - DOMAIN-SUFFIX,t.co,📱 社交
  - DOMAIN-SUFFIX,fb.com,📱 社交
  - RULE-SET,instagram,📱 社交
  - RULE-SET,social,📱 社交

  # === 流媒体（YouTube / Netflix / Disney+ / HBO Max / Prime Video / Twitch / Spotify）===
  - DOMAIN-KEYWORD,youtube,🎬 流媒体
  - DOMAIN-KEYWORD,googlevideo,🎬 流媒体
  - DOMAIN-SUFFIX,youtube.com,🎬 流媒体
  - DOMAIN-SUFFIX,youtu.be,🎬 流媒体
  - DOMAIN-KEYWORD,netflix,🎬 流媒体
  - DOMAIN-SUFFIX,nflxvideo.net,🎬 流媒体
  - DOMAIN-KEYWORD,disney,🎬 流媒体
  - DOMAIN-KEYWORD,hbo,🎬 流媒体
  - DOMAIN-KEYWORD,primevideo,🎬 流媒体
  - DOMAIN-KEYWORD,twitch,🎬 流媒体
  - DOMAIN-KEYWORD,spotify,🎬 流媒体
  - RULE-SET,proxy-media,🎬 流媒体
  - RULE-SET,netflix,🎬 流媒体
  - RULE-SET,streaming,🎬 流媒体

  # === TikTok ===
  - DOMAIN-KEYWORD,tiktok,🏷️ TikTok
  - DOMAIN-SUFFIX,tiktok.com,🏷️ TikTok
  - RULE-SET,tiktok,🏷️ TikTok

  # === Telegram（内联关键词先匹配，RULE-SET兜底）===
  - DOMAIN-KEYWORD,telegram,📲 电报消息
  - DOMAIN-SUFFIX,t.me,📲 电报消息
  - DOMAIN-SUFFIX,telegram.org,📲 电报消息
  - RULE-SET,telegram,📲 电报消息
  - RULE-SET,telegramcidr,📲 电报消息,no-resolve

  # === Google（已剥离YouTube/Play/FCM/Gemini，三套规则并入同一组）===
  # apis.google.com 是 Google 全系共用的 API JS 加载网关（搜索页也会拉），
  # 曾被 blackmatrix7 误放进 Gemini 分类导致谷歌搜索被 AI 组截走，已剔除并在此显式接管。
  - DOMAIN-SUFFIX,apis.google.com,🔍 Google
  - RULE-SET,google,🔍 Google
  - RULE-SET,googleplay,🔍 Google
  - RULE-SET,googlefcm,🔍 Google

  # === Apple ===
  - RULE-SET,apple,🍎 苹果服务

  # === 开发者（GitHub / GitLab / Bitbucket / Docker Hub / npmjs / PyPI）===
  - DOMAIN-KEYWORD,github,💻 开发者
