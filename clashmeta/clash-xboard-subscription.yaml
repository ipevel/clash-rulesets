  - DOMAIN-SUFFIX,npmjs.org,💻 开发者
  - DOMAIN-SUFFIX,pypi.org,💻 开发者
  - DOMAIN-SUFFIX,pythonhosted.org,💻 开发者
  - RULE-SET,github,💻 开发者
