mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090
clash-for-android:
  append-system-dns: false
unified-delay: true
global-client-fingerprint: chrome
keep-alive-interval: 360
proxies: ~

# --- 1. 远程规则集定义 (Rule Providers) ---
rule-providers:
  # === AI（精确，放最前面防止截流）===
  openai:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/OpenAI.yaml"
    path: ./ruleset/openai-v2.yaml
    interval: 3600

  claude:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/Claude.yaml"
    path: ./ruleset/claude-v2.yaml
    interval: 3600

  googlegemini:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/GoogleGemini.yaml"
    path: ./ruleset/googlegemini-v2.yaml
    interval: 3600

  # 合并 AI 清单（Groq/Perplexity/Mistral/Meta AI/xAI/Cursor/JetBrains/Copilot 等）。
  # 生成阶段已剔除 auth0/stripe/sentry/intercom/cloudflare-challenges 等第三方基础设施域名
  # （见 generate_providers.py 的 AI_INFRA_DROP），所以可以安全地放在靠前位置。
  ai:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/AI.yaml"
    path: ./ruleset/ai-v2.yaml
    interval: 3600

  # === 社交 ===
  instagram:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/Instagram.yaml"
    path: ./ruleset/instagram-v2.yaml
    interval: 3600

  # 合并社交清单：Twitter / Facebook / Whatsapp / Discord / Reddit
  social:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/Social.yaml"
    path: ./ruleset/social-v2.yaml
    interval: 3600

  # === 流媒体 ===
  proxy-media:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/ProxyMedia.yaml"
    path: ./ruleset/proxy-media-v2.yaml
    interval: 3600

  netflix:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/Netflix.yaml"
    path: ./ruleset/netflix-v2.yaml
    interval: 3600

  # 合并流媒体清单：Disney+ / HBO Max / Prime Video / Twitch / Spotify
  streaming:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/Streaming.yaml"
    path: ./ruleset/streaming-v2.yaml
    interval: 3600

  tiktok:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/TikTok.yaml"
    path: ./ruleset/tiktok-v2.yaml
    interval: 3600

  # === Google（Google / Google Play / Google FCM 三合一）===
  google:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/Google.yaml"
    path: ./ruleset/google-v2.yaml
    interval: 3600

  googleplay:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/GooglePlay.yaml"
    path: ./ruleset/googleplay-v2.yaml
    interval: 3600

  googlefcm:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/GoogleFCM.yaml"
    path: ./ruleset/googlefcm-v2.yaml
    interval: 3600

  # === Apple ===
  apple:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/Apple.yaml"
    path: ./ruleset/apple-v2.yaml
    interval: 3600

  # === 开发者 ===
  github:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ipevel/clash-rulesets@main/clashmeta/providers/GitHub.yaml"
    path: ./ruleset/github-v2.yaml
