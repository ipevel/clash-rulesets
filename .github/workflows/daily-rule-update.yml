name: Daily Rule Update

on:
  schedule:
    # 每天 UTC 02:00 = 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate providers
        run: |
          python3 scripts/generate_providers.py --update-template

      - name: Refactor config (RULE-SET extract + dedup)
        run: |
          # 把内联大段抽成 RULE-SET 引用（full 配置启动内存 5MB→200KB）
          # 同时全文去重（去 ~15000 条重复规则）
          python3 scripts/refactor_to_rule_set.py

      - name: Validate YAML
        run: |
          pip install pyyaml
          python3 - <<'EOF'
          import yaml, glob, sys
          ok = True
          for f in glob.glob("clashmeta/providers/*.yaml"):
              try:
                  d = yaml.safe_load(open(f))
                  assert isinstance(d, dict) and "payload" in d
              except Exception as e:
                  print(f"FAIL {f}: {e}")
                  ok = False
          try:
              d = yaml.safe_load(open("clashmeta/clash-xboard-subscription.yaml"))
              assert d.get("proxies") is None, "proxies must be null"
              assert len(d.get("rule-providers", {})) >= 20
          except Exception as e:
              print(f"FAIL template: {e}")
              ok = False
          print("YAML validation:", "OK" if ok else "FAILED")
          sys.exit(0 if ok else 1)

      - name: Commit and push if changed
        run: |
          git config user.name "clash-rulesets-bot"
          git config user.email "ipevel@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: daily rule update $(date -u +%Y-%m-%d)"
            git push origin main
            echo "Pushed updates"
          fi

      # 注意: 数据库同步由本机 (OpenClaw 服务器) 的 systemd timer 执行，
      # 因为 GitHub Actions 运行环境无法直连阿里云 RDS（白名单限制）。
      # 本机脚本: /root/clash-rulesets/scripts/sync_to_xboard.py
